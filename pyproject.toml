[project]
name = "pqs-lab"
version = "0.1.0"
description = "Agentic AI for scientific discovery: six AI agents screen approved drugs, orchestrated with Databricks Omnigent."
requires-python = ">=3.12"
# NO runtime dependencies, deliberately.
#
# The science engine (RDKit) is 265 MB unpacked and exceeds Vercel's 250 MB
# serverless function limit, so it cannot be deployed. The deployed service
# therefore answers from the committed, verified run in evidence/results.json --
# byte-identical numbers to a local `python -m lab.orchestrator` execution -- and
# the frontend labels it as the frozen run. RDKit stays in the repo and runs
# locally. See README "Deployment".
dependencies = []

[project.optional-dependencies]
# Preview server only. The deployed function needs nothing.
dev = ["waitress"]

[tool.vercel]
entrypoint = "index:app"
# Vercel only bundles files it can trace from imports. These are data files the
# service and the site read at runtime, so they are included explicitly.
include = [
  "index.html",
  "assets/fonts.css",
  "assets/fonts/*.woff2",
  "evidence/results.json",
  "evidence/citations.json",
  "research_record.json",
  "lab/screening.py",
  "lab/service_worker.py",
]
